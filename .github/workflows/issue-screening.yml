# Screens new and edited issues, and applies a maintainer's approved / rejected label.
# See .github/scripts/triage.cjs for the rules.
name: issue screening

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const triage = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.cjs`);
            await triage.run({ github, context, core });
